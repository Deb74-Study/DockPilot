<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Index</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 1200px; }
    th, td { border: 1px solid #888; padding: 6px 8px; text-align: left; }
    td { font-size: 11px; }
    th { background: #f2f2f2; font-size: 14px; font-weight: bold; text-align: center; }
    .sl-no-col { width: 16px; text-align: center; }
    .mandatory-col { width: 70px; text-align: center; }
    .reqd-col { width: 60px; }
    .section-col { width: 120px; }
    .section-code-col { display: none; }
    .job-id-col { width: 80px; }
    td.job-id-col.has-job-id {
      text-decoration: underline;
      cursor: pointer;
      color: #0b4ea2;
      font-weight: 700;
    }
    .job-status-col { width: 75px; }
    .description-col { width: 250px; }
    .timing-col { width: 140px; }
    .responsibility-col { width: 130px; }
    input[type=text] { width: 100%; box-sizing: border-box; font-size: 11px; }
    select { width: 100%; box-sizing: border-box; font-size: 11px; }
    input[type=checkbox] { width: 16px; height: 16px; }
    .small-btn { padding: 4px 8px; cursor: pointer; }
    .button-cell { border: none; padding: 8px; text-align: left; }
    .button-cell-header { border: none; }
    #addRowCell { text-align: left; }
    td.mandatory-col { text-align: center; }
  </style>
</head>
<body>
  <h1 style="display:inline-block; margin-right: 20px; font-size: 24px;">Job Index</h1>
  <button id="undoBtn" class="small-btn" title="Undo last change"><b>&#8592;1</b></button>
  <button id="redoBtn" class="small-btn" title="Redo last undone change" disabled><b>&#8594;1</b></button>
  <button id="saveBtn" class="small-btn">Save</button>
  <button id="loadJsonBtn" class="small-btn">Load JSON</button>
  <button id="loadHtmlBtn" class="small-btn">Load from HTML</button>
  <input type="file" id="loadJsonInput" accept="application/json" style="display: none;" />
  <input type="file" id="loadHtmlInput" accept="text/html" style="display: none;" />
  <table id="jobTable">
    <thead>
      <tr id="headerRow">
        <th class="sl-no-col">Sl. No.</th>
        <th class="mandatory-col">Mandatory</th>
        <th class="reqd-col">Reqd.</th>
        <th class="section-col">Category</th>
        <th class="section-code-col">Section Code</th>
        <th class="job-id-col">Job ID</th><th class="job-status-col">Job Status</th><th class="description-col">Description</th><th class="timing-col">Timing</th><th class="responsibility-col">Responsibility</th><th>Col 10</th>
        <th class="button-cell-header" id="addColHeader"></th>
      </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
      <tr id="addRowFooter">
        <td colspan="11" class="button-cell" id="addRowCell"></td>
      </tr>
    </tfoot>
  </table>

  <script>
    const sectionMap = {
      Docking: 'K',
      'General Services': 'GS',
      'Hull Husbandry': 'HH',
      Rudder: 'RD',
      'Propeller/Shafting': 'PS',
      'Anchor/Chain': 'AC',
      'Sea-chests/Anodes': 'SA',
      Deck: 'D',
      Steel: 'S',
      'Coating-Deck/WBT': 'C',
      'Piping-Deck': 'PD',
      Machinery: 'M',
      Electrical: 'E',
      'Piping-Engine': 'PE',
      'Radio/Navigation': 'RN'
    };

    const reqdOptions = ['Yes', 'No', 'Maybe'];
    const sectionOptions = Object.keys(sectionMap);
    const COL_SL_NO = 0;
    const COL_MANDATORY = 1;
    const COL_REQD = 2;
    const COL_SECTION = 3;
    const COL_SECTION_CODE = 4;
    const COL_JOB_ID = 5;
    const COL_FIRST_DYNAMIC = 6;
    const COL_TIMING = 8;
    const COL_RESPONSIBILITY = 9;
    const BASE_COLUMN_COUNT = 11;
    const DEFAULT_DYNAMIC_COLUMN_COUNT = BASE_COLUMN_COUNT - COL_FIRST_DYNAMIC;
    const SPEC_CONTEXT_SESSION_KEY = 'DOCKPILOT_SPEC_CONTEXT';

    const table = document.getElementById('jobTable');
    const tbody = table.querySelector('tbody');
    const addRowCell = document.getElementById('addRowCell');
    const addColHeader = document.getElementById('addColHeader');
    const sectionCodeCounter = {}; // Track highest number for each section code

    let nextRowId = 1001;
    let nextColId = 1001;

    // Undo history stack: each entry is { element, type: 'input'|'select'|'section', oldValue }
    const undoStack = [];
    let undoEnabled = true; // prevent recursive undo pushes
    let redoEntry = null;   // single-level redo

    function pushUndo(element, type, oldValue) {
      if (!undoEnabled) return;
      undoStack.push({ element, type, oldValue });
      // Any new change clears the redo entry
      redoEntry = null;
      if (typeof redoBtn !== 'undefined') redoBtn.disabled = true;
    }

    // Assign initial column IDs
    const headerRow = table.tHead.rows[0];
    for (let i = 0; i < headerRow.cells.length - 1; i++) { // exclude add col button
      headerRow.cells[i].dataset.colId = nextColId++;
    }

    function refreshSerials() {
      Array.from(tbody.rows).forEach((row, i) => {
        row.cells[COL_SL_NO].textContent = i + 1;
      });
    }

    function updateColspan() {
      const headerCellCount = table.rows[0].cells.length;
      const addRowFooter = document.getElementById('addRowFooter');
      addRowFooter.cells[0].colSpan = headerCellCount;
    }

    function syncMandatoryAndReqdState(mandatoryInput, reqdSel) {
      if (!mandatoryInput || !reqdSel) return;

      if (!mandatoryInput.dataset.previousReqdValue) {
        mandatoryInput.dataset.previousReqdValue = reqdSel.value || 'Yes';
      }

      if (mandatoryInput.checked) {
        if (reqdSel.value !== 'Yes') {
          mandatoryInput.dataset.previousReqdValue = reqdSel.value || mandatoryInput.dataset.previousReqdValue || 'Yes';
        }
        reqdSel.value = 'Yes';
        reqdSel.disabled = true;
      } else {
        reqdSel.disabled = false;
        if (mandatoryInput.dataset.previousReqdValue) {
          reqdSel.value = mandatoryInput.dataset.previousReqdValue;
        }
      }
    }

    function updateSectionCodeCounter() {
      // Reset and recalculate all section code counters
      Object.keys(sectionCodeCounter).forEach(key => sectionCodeCounter[key] = 0);
      Array.from(tbody.rows).forEach(row => {
        const jobIdCell = row.cells[COL_JOB_ID];
        const jobId = jobIdCell.textContent;
        if (jobId) {
          const match = jobId.match(/([A-Z]+)-(\d+)/);
          if (match) {
            const code = match[1];
            const num = parseInt(match[2], 10);
            if (!sectionCodeCounter[code] || sectionCodeCounter[code] < num) {
              sectionCodeCounter[code] = num;
            }
          }
        }
      });
    }

    function getNextJobID(sectionCode) {
      if (!sectionCode) return '';
      if (!sectionCodeCounter[sectionCode]) {
        sectionCodeCounter[sectionCode] = 1;
      } else {
        sectionCodeCounter[sectionCode]++;
      }
      const num = String(sectionCodeCounter[sectionCode]).padStart(3, '0');
      return `${sectionCode}-${num}`;
    }

    function updateAllJobIDs() {
      // Reset counters
      Object.keys(sectionCodeCounter).forEach(key => sectionCodeCounter[key] = 0);
      
      // Regenerate all Job IDs sequentially based on section code order
      Array.from(tbody.rows).forEach(row => {
        const sectionCodeCell = row.cells[COL_SECTION_CODE];
        const sectionCode = sectionCodeCell.textContent;
        const jobIdCell = row.cells[COL_JOB_ID];
        
        if (sectionCode) {
          // Generate next Job ID for this section code
          jobIdCell.textContent = getNextJobID(sectionCode);
        } else {
          jobIdCell.textContent = '';
        }

        const hasJobId = jobIdCell.textContent.trim() !== '';
        jobIdCell.classList.toggle('has-job-id', hasJobId);
        jobIdCell.title = hasJobId ? 'Click to open spec template' : '';
      });
    }

    function openSpecTemplateFromRow(row) {
      if (!row) return;

      const jobId = row.cells[COL_JOB_ID]?.textContent?.trim() || '';
      if (!jobId) return;

      const mandatoryInput = row.cells[COL_MANDATORY]?.querySelector('input[type="checkbox"]');
      const mandatory = mandatoryInput?.checked === true;

      const contextPayload = {
        jobId,
        mandatory
      };

      try {
        sessionStorage.setItem(SPEC_CONTEXT_SESSION_KEY, JSON.stringify(contextPayload));
      } catch (error) {
        console.warn('Unable to write spec context to sessionStorage:', error);
      }

      const params = new URLSearchParams({
        jobId,
        mandatory: mandatory ? 'yes' : 'no'
      });

      window.open(`./spec-template.html?${params.toString()}`, '_blank', 'noopener');
    }

    function serializeTable() {
      const columns = table.tHead.rows[0].cells.length - 1; // exclude add-column header
      const rows = Array.from(tbody.rows).map(row => {
        const mandatoryInput = row.cells[COL_MANDATORY].querySelector('input[type="checkbox"]');
        const rowData = {
          mandatory: mandatoryInput?.checked === true,
          reqd: row.cells[COL_REQD].querySelector('select')?.value || '',
          section: row.cells[COL_SECTION].querySelector('select')?.value || '',
          sectionCode: row.cells[COL_SECTION_CODE].textContent || '',
          jobId: row.cells[COL_JOB_ID].textContent || '',
          values: []
        };
        for (let i = COL_FIRST_DYNAMIC; i < row.cells.length - 1; i++) {
          const input = row.cells[i].querySelector('input');
          const select = row.cells[i].querySelector('select');
          const value = input ? input.value : (select ? select.value : '');
          rowData.values.push(value);
        }
        return rowData;
      });
      return { columns, rows };
    }

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function getCurrentTimestamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
    }

    function saveTableJson() {
      const payload = serializeTable();
      const timestamp = getCurrentTimestamp();
      downloadJson(`Job Index ${timestamp}.json`, payload);
    }

    function saveTableBoth() {
      saveTableJson();
      saveTableHtml();
    }

    function generateHtmlContent() {
      const exportTimestamp = new Date().toLocaleString();
      const styles = `
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 1200px; }
        th, td { border: 1px solid #888; padding: 6px 8px; text-align: left; }
        th { background: #f2f2f2; }
      `;

      const headerCells = Array.from(table.tHead.rows[0].cells)
        .slice(0, -1)
        .filter(cell => !cell.classList.contains('section-code-col'))
        .map(cell => `<th>${cell.textContent || ''}</th>`)
        .join('');

      const bodyRows = Array.from(tbody.rows).map(row => {
        const cells = Array.from(row.cells)
          .slice(0, -1)
          .filter(cell => !cell.classList.contains('section-code-col'));
        return `<tr>${cells.map((cell) => {
          const checkbox = cell.querySelector('input[type="checkbox"]');
          if (checkbox) return `<td>${checkbox.checked ? 'Yes' : ''}</td>`;
          return `<td>${cell.querySelector('input')?.value || cell.querySelector('select')?.value || cell.textContent || ''}</td>`;
        }).join('')}</tr>`;
      }).join('');

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Index Export</title>
  <style>${styles}</style>
</head>
<body>
  <h1>Job Index Export</h1>
  <p>Exported on: ${exportTimestamp}</p>
  <table>
    <thead>
      <tr>${headerCells}</tr>
    </thead>
    <tbody>
      ${bodyRows}
    </tbody>
  </table>
</body>
</html>`;
    }

    function saveTableHtml() {
      const html = generateHtmlContent();
      const timestamp = getCurrentTimestamp();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Job Index Export ${timestamp}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function clearTableRows() {
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    }

    function loadTableData(data) {
      if (!data || !Array.isArray(data.rows)) return;

      const currentColumns = table.tHead.rows[0].cells.length - 1;
      const currentExtraColumns = Math.max(0, currentColumns - BASE_COLUMN_COUNT);
      const targetExtraColumns = Math.max(0, data.rows.reduce((max, row) => {
        const valueCount = Array.isArray(row?.values) ? row.values.length : 0;
        return Math.max(max, valueCount - DEFAULT_DYNAMIC_COLUMN_COUNT);
      }, 0));

      if (currentExtraColumns < targetExtraColumns) {
        for (let i = currentExtraColumns; i < targetExtraColumns; i++) {
          addColumn();
        }
      } else if (currentExtraColumns > targetExtraColumns) {
        const headerRow = table.tHead.rows[0];
        for (let i = currentColumns; i > BASE_COLUMN_COUNT + targetExtraColumns; i--) {
          headerRow.deleteCell(i - 1);
        }
        Array.from(tbody.rows).forEach(r => {
          for (let i = currentColumns; i > BASE_COLUMN_COUNT + targetExtraColumns; i--) {
            r.deleteCell(i);
          }
        });
        updateColspan();
      }

      clearTableRows();
      data.rows.forEach(rowData => {
        addRow();
        const r = tbody.rows[tbody.rows.length - 1];

        const mandatoryInput = r.cells[COL_MANDATORY].querySelector('input[type="checkbox"]');
        const reqdSel = r.cells[COL_REQD].querySelector('select');
        const sectionSel = r.cells[COL_SECTION].querySelector('select');

        if (mandatoryInput) mandatoryInput.checked = rowData.mandatory === true;
        if (reqdSel) reqdSel.value = rowData.reqd || '';
        if (sectionSel) sectionSel.value = rowData.section || '';

        r.cells[COL_SECTION_CODE].textContent = rowData.sectionCode || '';
        r.cells[COL_JOB_ID].textContent = rowData.jobId || '';
        r.cells[COL_JOB_ID].classList.toggle('has-job-id', (rowData.jobId || '').trim() !== '');
        r.cells[COL_JOB_ID].title = (rowData.jobId || '').trim() !== '' ? 'Click to open spec template' : '';

        syncMandatoryAndReqdState(mandatoryInput, reqdSel);

        for (let i = 0; i < (rowData.values || []).length; i++) {
          const cell = r.cells[COL_FIRST_DYNAMIC + i];
          if (cell) {
            const input = cell.querySelector('input');
            const select = cell.querySelector('select');
            if (input) {
              input.value = rowData.values[i];
            } else if (select) {
              select.value = rowData.values[i];
            }
          }
        }
      });

      refreshSerials();
      updateAllJobIDs();
    }

    function parseHtmlTable(htmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');
      const htmlTable = doc.querySelector('table');
      if (!htmlTable) throw new Error('No table found in HTML');

      const headerCells = Array.from(htmlTable.querySelectorAll('thead tr th')).map(th => th.textContent.trim());
      const hasMandatoryColumn = headerCells.includes('Mandatory');
      const hasSectionCodeColumn = headerCells.includes('Section Code');
      const rows = Array.from(htmlTable.querySelectorAll('tbody tr'));
      const rowData = rows.map(row => {
        const cells = Array.from(row.querySelectorAll('td'));
        const data = { mandatory: false, reqd: '', section: '', sectionCode: '', jobId: '', values: [] };
        if (cells.length >= 5) {
          let cursor = 1;
          if (hasMandatoryColumn) {
            const mandatoryText = cells[cursor]?.textContent.trim().toLowerCase() || '';
            data.mandatory = ['yes', 'true', 'checked', 'x'].includes(mandatoryText);
            cursor += 1;
          }

          data.reqd = cells[cursor]?.textContent.trim() || '';
          cursor += 1;
          data.section = cells[cursor]?.textContent.trim() || '';
          cursor += 1;

          if (hasSectionCodeColumn) {
            data.sectionCode = cells[cursor]?.textContent.trim() || '';
            cursor += 1;
          }

          data.jobId = cells[cursor]?.textContent.trim() || '';
          cursor += 1;

          for (let i = cursor; i < cells.length; i++) {
            data.values.push(cells[i].textContent.trim());
          }
        }
        return data;
      });

      return { columns: Math.max(headerCells.length, BASE_COLUMN_COUNT), rows: rowData };
    }

    function loadTableFromFile(file) {
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const data = JSON.parse(fr.result);
          loadTableData(data);
        } catch (e) {
          alert('Invalid JSON table file');
        }
      };
      fr.readAsText(file);
    }

    function loadHtmlFromFile(file) {
      const proceed = confirm('Warning: loading HTML fallback may overwrite current table content and does not guarantee perfect parsing. Continue?');
      if (!proceed) return;

      const fr = new FileReader();
      fr.onload = () => {
        try {
          const data = parseHtmlTable(fr.result);
          loadTableData(data);
        } catch (e) {
          alert('Invalid HTML table file');
        }
      };
      fr.readAsText(file);
    }

    function setCellId(cell, rowId, colId) {
      const sup = cell.querySelector('sup');
      if (sup) {
        sup.textContent = rowId + 'X' + colId;
      }
    }

    function makeTextCell(defaultVal = '') {
      const td = document.createElement('td');
      const sup = document.createElement('sup');
      sup.style.color = 'pink';
      td.appendChild(sup);
      const input = document.createElement('input');
      input.type = 'text';
      input.value = defaultVal;
      input.addEventListener('focus', () => { input._undoVal = input.value; });
      input.addEventListener('change', () => { pushUndo(input, 'input', input._undoVal); input._undoVal = input.value; });
      td.appendChild(input);
      return td;
    }

    function makeCheckboxCell(defaultChecked = false) {
      const td = document.createElement('td');
      td.className = 'mandatory-col';
      const sup = document.createElement('sup');
      sup.style.color = 'pink';
      td.appendChild(sup);
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = defaultChecked;
      input.addEventListener('focus', () => { input._undoChecked = input.checked; });
      input.addEventListener('change', () => {
        pushUndo(input, 'checkbox', input._undoChecked === true);
        input._undoChecked = input.checked;
      });
      td.appendChild(input);
      return td;
    }

    function makeSelectCell(options, onChange) {
      const td = document.createElement('td');
      const sup = document.createElement('sup');
      sup.style.color = 'pink';
      td.appendChild(sup);
      const sel = document.createElement('select');
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        sel.appendChild(o);
      });
      sel.addEventListener('focus', () => { sel._undoVal = sel.value; });
      sel.addEventListener('change', () => {
        pushUndo(sel, 'select', sel._undoVal);
        sel._undoVal = sel.value;
        onChange();
      });
      td.appendChild(sel);
      return td;
    }

    function addRow() {
      const r = tbody.insertRow();
      r.dataset.rowId = nextRowId++;

      const slNo = r.insertCell();
      const slNoSup = document.createElement('sup');
      slNoSup.style.color = 'pink';
      slNo.appendChild(slNoSup);
      slNo.textContent = tbody.rows.length;
      slNo.style.fontWeight = 'bold';
      slNo.className = 'sl-no-col';

      const mandatoryCell = makeCheckboxCell(false);
      r.appendChild(mandatoryCell);

      const reqdCell = r.insertCell();
      reqdCell.className = 'reqd-col';
      const reqdSup = document.createElement('sup');
      reqdSup.style.color = 'pink';
      reqdCell.appendChild(reqdSup);
      const reqdSel = document.createElement('select');
      reqdOptions.forEach(val => {
        const o = document.createElement('option'); o.value = val; o.textContent = val; reqdSel.appendChild(o);
      });
      reqdSel.addEventListener('focus', () => { reqdSel._undoVal = reqdSel.value; });
      reqdSel.addEventListener('change', () => { pushUndo(reqdSel, 'select', reqdSel._undoVal); reqdSel._undoVal = reqdSel.value; });
      reqdCell.appendChild(reqdSel);

      const mandatoryInput = mandatoryCell.querySelector('input[type="checkbox"]');
      mandatoryInput.addEventListener('change', () => {
        syncMandatoryAndReqdState(mandatoryInput, reqdSel);
      });

      const sectionCell = r.insertCell();
  sectionCell.className = 'section-col';
      const sectionSup = document.createElement('sup');
      sectionSup.style.color = 'pink';
      sectionCell.appendChild(sectionSup);
      const sectionSel = document.createElement('select');
      const emptyOption = document.createElement('option');
      emptyOption.value = '';
      emptyOption.textContent = '';
      sectionSel.appendChild(emptyOption);
      sectionOptions.forEach(val => {
        const o = document.createElement('option'); o.value = val; o.textContent = val; sectionSel.appendChild(o);
      });
      sectionCell.appendChild(sectionSel);

      const sectionCodeCell = r.insertCell();
  sectionCodeCell.className = 'section-code-col';
      const sectionCodeSup = document.createElement('sup');
      sectionCodeSup.style.color = 'pink';
      sectionCodeCell.appendChild(sectionCodeSup);
      sectionCodeCell.textContent = '';

      const jobIdCell = r.insertCell();
  jobIdCell.className = 'job-id-col';
      const jobIdSup = document.createElement('sup');
      jobIdSup.style.color = 'pink';
      jobIdCell.appendChild(jobIdSup);
      jobIdCell.textContent = '';
        jobIdCell.title = '';

      sectionSel.addEventListener('focus', () => { sectionSel._undoVal = sectionSel.value; });
      sectionSel.addEventListener('change', () => {
        const oldSectionVal = sectionSel._undoVal;
        const oldSectionCode = sectionCodeCell.textContent;
        // Capture all old job IDs before update
        const oldJobIds = Array.from(tbody.rows).map(row => row.cells[COL_JOB_ID].textContent);
        pushUndo({ sectionSel, sectionCodeCell, oldSectionCode, oldJobIds, tbody }, 'section', oldSectionVal);
        sectionSel._undoVal = sectionSel.value;
        const code = sectionMap[sectionSel.value] || '';
        sectionCodeCell.textContent = code;
        updateAllJobIDs();
      });

      const colCount = table.rows[0].cells.length - 1; // -1 for add col button
      const timingOptions = ['Before Docking - Sailing', 'Before Docking - Anchor', 'During Docking', 'After Docking - Anchor', 'After Docking - Sailing'];
      const responsibilityOptions = ['Yard', 'Crew', 'Contr.', 'Yard / Crew', 'Crew / Contr.', 'Yard / Crew / Contr.'];
      for (let i = COL_FIRST_DYNAMIC; i < colCount; i++) {
        if (i === COL_TIMING) {
          r.appendChild(makeSelectCell(timingOptions, () => {}));
        } else if (i === COL_RESPONSIBILITY) {
          r.appendChild(makeSelectCell(responsibilityOptions, () => {}));
        } else {
          r.appendChild(makeTextCell(''));
        }
      }

      const deleteButtonCell = r.insertCell();
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Delete';
      deleteBtn.className = 'small-btn';
      deleteBtn.addEventListener('click', () => {
        tbody.removeChild(r);
        refreshSerials();
        updateAllJobIDs();
      });
      deleteButtonCell.appendChild(deleteBtn);

      // Set cell IDs for all cells
      for (let i = 0; i < r.cells.length - 1; i++) { // exclude delete button cell
        setCellId(r.cells[i], r.dataset.rowId, headerRow.cells[i].dataset.colId);
      }

      syncMandatoryAndReqdState(mandatoryInput, reqdSel);
    }

    function addColumn() {
      const headRow = table.tHead.rows[0];
      const nextIndex = headRow.cells.length; // before the Add Col button
      const newHead = document.createElement('th');
      newHead.textContent = `Col ${nextIndex}`;
      newHead.dataset.colId = nextColId++;
      headRow.insertBefore(newHead, addColHeader);
      Array.from(tbody.rows).forEach(r => {
        const td = document.createElement('td');
        const sup = document.createElement('sup');
        sup.style.color = 'pink';
        sup.textContent = r.dataset.rowId + 'X' + newHead.dataset.colId;
        td.appendChild(sup);
        const inp = document.createElement('input');
        inp.type = 'text';
        td.appendChild(inp);
        r.insertBefore(td, r.lastElementChild);
      });
      updateColspan();
    }

    // Initialize "Add Row" button in footer
    const addRowBtn = document.createElement('button');
    addRowBtn.id = 'addRowBtn';
    addRowBtn.className = 'small-btn';
    addRowBtn.textContent = 'Add Row';
    addRowBtn.addEventListener('click', addRow);
    addRowCell.appendChild(addRowBtn);

    // Initialize "Add Column" button in header
    const addColBtn = document.createElement('button');
    addColBtn.id = 'addColBtn';
    addColBtn.className = 'small-btn';
    addColBtn.textContent = 'Add Column';
    addColBtn.addEventListener('click', addColumn);
    addColHeader.appendChild(addColBtn);

    // Undo handler
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');

    function getElementCurrentState(entry) {
      // Capture current value before restoring, to allow redo to re-apply it
      if (entry.type === 'input') return { ...entry, oldValue: entry.element.value };
      if (entry.type === 'select') return { ...entry, oldValue: entry.element.value };
      if (entry.type === 'section') {
        const { sectionSel, sectionCodeCell } = entry.element;
        const currentJobIds = Array.from(tbody.rows).map(row => row.cells[COL_JOB_ID].textContent);
        return { ...entry, element: { ...entry.element, oldSectionCode: sectionCodeCell.textContent, oldJobIds: currentJobIds }, oldValue: sectionSel.value };
      }
    }

    undoBtn.addEventListener('click', () => {
      if (undoStack.length === 0) return;
      const last = undoStack.pop();
      // Save current state as redo entry before restoring
      redoEntry = getElementCurrentState(last);
      redoBtn.disabled = false;
      undoEnabled = false;
      if (last.type === 'input') {
        last.element.value = last.oldValue;
        last.element.dispatchEvent(new Event('change'));
      } else if (last.type === 'checkbox') {
        last.element.checked = last.oldValue === true;
        last.element.dispatchEvent(new Event('change'));
      } else if (last.type === 'select') {
        last.element.value = last.oldValue;
        last.element.dispatchEvent(new Event('change'));
      } else if (last.type === 'section') {
        const { sectionSel, sectionCodeCell, oldSectionCode, oldJobIds } = last.element;
        sectionSel.value = last.oldValue;
        sectionSel._undoVal = last.oldValue;
        sectionCodeCell.textContent = oldSectionCode;
        Array.from(tbody.rows).forEach((row, i) => {
          row.cells[COL_JOB_ID].textContent = oldJobIds[i] || '';
        });
      }
      undoEnabled = true;
    });

    // Redo handler (single level)
    redoBtn.addEventListener('click', () => {
      if (!redoEntry) return;
      const entry = redoEntry;
      redoEntry = null;
      redoBtn.disabled = true;
      undoEnabled = false;
      if (entry.type === 'input') {
        entry.element.value = entry.oldValue;
        entry.element.dispatchEvent(new Event('change'));
      } else if (entry.type === 'checkbox') {
        entry.element.checked = entry.oldValue === true;
        entry.element.dispatchEvent(new Event('change'));
      } else if (entry.type === 'select') {
        entry.element.value = entry.oldValue;
        entry.element.dispatchEvent(new Event('change'));
      } else if (entry.type === 'section') {
        const { sectionSel, sectionCodeCell, oldSectionCode, oldJobIds } = entry.element;
        sectionSel.value = entry.oldValue;
        sectionSel._undoVal = entry.oldValue;
        sectionCodeCell.textContent = oldSectionCode;
        Array.from(tbody.rows).forEach((row, i) => {
          row.cells[COL_JOB_ID].textContent = oldJobIds[i] || '';
        });
      }
      undoEnabled = true;
    });

    // Initialize save/load buttons
    const saveBtn = document.getElementById('saveBtn');
    const loadJsonBtn = document.getElementById('loadJsonBtn');
    const loadHtmlBtn = document.getElementById('loadHtmlBtn');
    const loadJsonInput = document.getElementById('loadJsonInput');
    const loadHtmlInput = document.getElementById('loadHtmlInput');

    saveBtn.addEventListener('click', saveTableBoth);
    loadJsonBtn.addEventListener('click', () => loadJsonInput.click());
    loadHtmlBtn.addEventListener('click', () => loadHtmlInput.click());

    loadJsonInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        loadTableFromFile(file);
      }
      loadJsonInput.value = '';
    });

    loadHtmlInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        loadHtmlFromFile(file);
      }
      loadHtmlInput.value = '';
    });

    tbody.addEventListener('click', (event) => {
      const jobIdCell = event.target.closest('td.job-id-col');
      if (!jobIdCell) return;

      const row = jobIdCell.parentElement;
      if (!(row instanceof HTMLTableRowElement)) return;

      openSpecTemplateFromRow(row);
    });

    addRow();
  </script>

  <script type="module">
    import { supabase } from './supabaseClient.js';
    import { startDockPilotPageGuard } from './dockpilotPageGuard.js';
    import { loadSavedTheme } from './dockpilotTheme.js';

    // Apply saved theme before anything renders
    loadSavedTheme();

    startDockPilotPageGuard({
      supabase,
      landingPage: './DockPilot_landing.html'
    }).catch((error) => {
      console.error('DockPilot guard startup failed:', error);
      window.location.href = './DockPilot_landing.html';
    });
  </script>
</body>
</html>
