services:
  dockpilot-db:
    image: postgres:17-alpine
    container_name: dockpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dockpilot
      POSTGRES_USER: dockpilot
      POSTGRES_PASSWORD: dockpilot_local_dev
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockpilot -d dockpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  dockpilot-web:
    build:
      context: .
    image: dockpilot:latest
    ports:
      - "8080:80"