<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DockPilot | Docking Software</title>
  <style>
    :root {
      --landscape-ratio: 1.58;
      --edge-padding: clamp(12px, 1.6vw, 22px);
      --panel: rgba(9, 16, 32, 0.82);
      --panel-soft: rgba(18, 29, 54, 0.72);
      --text: #eef4ff;
      --muted: #aebcda;
      --accent: #67d6ff;
      --accent-2: #5c8dff;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--edge-padding);
      font-family: Inter, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top left, #133977 0%, transparent 32%),
        radial-gradient(circle at bottom right, #0f8f98 0%, transparent 30%),
        linear-gradient(135deg, #06111f, #0a1830 40%, #07111e 100%);
      color: var(--text);
    }

    .writing-area {
      /* Main adaptive rule:
         uses max height when possible,
         otherwise width becomes the limiting factor */
      width: min(
        calc(100vw - (var(--edge-padding) * 2)),
        calc((100dvh - (var(--edge-padding) * 2)) * var(--landscape-ratio))
      );
      height: min(
        calc(100dvh - (var(--edge-padding) * 2)),
        calc((100vw - (var(--edge-padding) * 2)) / var(--landscape-ratio))
      );

      max-width: 1400px;
      max-height: 900px;
      background: linear-gradient(180deg, rgba(9,16,32,.92), rgba(8,12,25,.95));
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: clamp(18px, 2vw, 28px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(16px, 1.5vw, 22px);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      font-weight: 700;
      letter-spacing: .02em;
      font-size: 2rem;
    }

    .header-actions {
      display: inline-flex;
      align-items: flex-start;
      gap: 10px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .brand-name {
      line-height: 1;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06111f;
      font-weight: 900;
      font-size: 2rem;
    }

    nav {
      display: flex;
      gap: 16px;
      color: var(--muted);
      font-size: .95rem;
      flex-wrap: wrap;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: clamp(16px, 2vw, 28px);
      min-height: 0;
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(103,214,255,.12);
      color: var(--accent);
      font-size: .84rem;
      border: 1px solid rgba(103,214,255,.18);
    }

    .brand .eyebrow {
      font-size: .78rem;
      padding: 6px 11px;
    }

    .lead {
      font-size: clamp(1rem, 1.25vw, 1.12rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 60ch;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0 20px;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), #77f1d5);
      color: #07111e;
    }

    .btn.secondary {
      background: rgba(255,255,255,.04);
      border-color: var(--border);
      color: var(--text);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(103,214,255,.60);
      background: linear-gradient(135deg, rgba(10,55,120,.80), rgba(8,110,130,.72));
      color: #eef4ff;
    }

    .return-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #06263a;
      background: var(--accent);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .return-link:focus-visible {
      outline: 2px solid rgba(103,214,255,.5);
      outline-offset: 2px;
    }

    .return-link:hover,
    .return-link:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(103,214,255,.60);
      background: linear-gradient(135deg, rgba(10,55,120,.80), rgba(8,110,130,.72));
      color: #eef4ff;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .card strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .card span {
      color: var(--muted);
      font-size: .92rem;
    }

    .running-project-panel {
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent),
        #0a1326;
      border: 1px solid var(--border);
      border-radius: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
    }

    .running-project-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(103, 214, 255, 0.15);
      background: linear-gradient(180deg, rgba(11, 24, 45, 0.98), rgba(11, 24, 45, 0.9));
    }

    .running-project-title {
      margin: 0;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .running-project-year {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .running-project-year label {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.02em;
    }

    .running-project-year select {
      width: 112px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(3, 18, 35, 0.72);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .running-project-year select:focus-visible {
      outline: 2px solid rgba(103,214,255,.5);
      outline-offset: 2px;
    }

    .running-project-body {
      padding: 12px 14px 14px;
      display: grid;
      gap: 10px;
      align-content: start;
      overflow: auto;
    }

    .project-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.05);
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .project-item:hover,
    .project-item:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(103, 214, 255, 0.35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      outline: none;
    }

    .project-item small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .project-state {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-state.active {
      background: rgba(65,211,125,.12);
      color: #7ff0aa;
      border: 1px solid rgba(65, 211, 125, 0.25);
    }

    .project-state.pending {
      background: rgba(255,182,72,.12);
      color: #ffd48b;
      border: 1px solid rgba(255, 182, 72, 0.25);
    }

    .project-overview-empty {
      padding: 24px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      font-style: italic;
    }

    @media (max-width: 980px) {
      :root { --landscape-ratio: 1.33; }

      .hero {
        grid-template-columns: 1fr;
      }

      .highlights {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>
<body>
  <section class="writing-area">
    <header>
      <div class="brand">
        <div class="logo">DP</div>
        <div class="brand-copy">
          <span class="brand-name">DockPilot</span>
          <div class="eyebrow">⚓ Smart Docking Control</div>
        </div>
      </div>
      <div class="header-actions">
        <a class="return-link" href="./frontpage.html">Return to Frontpage</a>
      </div>
    </header>

    <main class="hero">
      <section>
        <div class="actions">
          <a class="btn primary" href="#">Request Demo</a>
          <a class="btn secondary" href="#">See Platform</a>
        </div>

        <div class="highlights">
          <div class="card">
            <strong>-22%</strong>
            <span>Average vessel idle time</span>
          </div>
          <div class="card">
            <strong>Live ETA</strong>
            <span>Shared across dock and ops teams</span>
          </div>
          <div class="card">
            <strong>24/7 View</strong>
            <span>For terminals, harbors, and fleets</span>
          </div>
        </div>
      </section>

      <aside class="running-project-panel">
        <div class="running-project-header">
          <h2 class="running-project-title">DD Projects Overview</h2>
          <div class="running-project-year">
            <label for="runningProjectYearSelect">Year</label>
            <select id="runningProjectYearSelect" aria-label="Year">
              <option value="2025">2025</option>
              <option value="2026">2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
              <option value="2029">2029</option>
              <option value="2030">2030</option>
              <option value="2031">2031</option>
              <option value="2032">2032</option>
              <option value="2033">2033</option>
              <option value="2034">2034</option>
              <option value="2035">2035</option>
              <option value="2036">2036</option>
              <option value="2037">2037</option>
              <option value="2038">2038</option>
              <option value="2039">2039</option>
              <option value="2040">2040</option>
            </select>
          </div>
        </div>

        <div id="runningProjectBody" class="running-project-body">
          <div class="project-overview-empty">Loading projects...</div>
        </div>
      </aside>
    </main>

  </section>

  <script type="module">
    import { supabase } from './supabaseClient.js';
    import { startDockPilotPageGuard } from './dockpilotPageGuard.js';
    import { getSession } from './dockpilotAuthContract.js';
    import { loadSavedTheme } from './dockpilotTheme.js';

    // Apply saved theme before anything renders
    loadSavedTheme();

    const DDP_RUNNING_PROJECT_CONTEXT_KEY = 'DOCKPILOT_RUNNING_PROJECT_CONTEXT';
    const yearSelect = document.getElementById('runningProjectYearSelect');
    const projectBody = document.getElementById('runningProjectBody');

    let allRecallProjects = [];
    let allRecallCheckpoints = [];

    function extractYearFromProject(project) {
      if (!project) return null;
      if (project.launch_date) {
        const d = new Date(project.launch_date);
        if (!Number.isNaN(d.getTime())) {
          return String(d.getFullYear());
        }
        const m = String(project.launch_date).match(/^(\d{4})/);
        if (m) return m[1];
      }
      if (project.project_key) {
        const m = String(project.project_key).match(/_(\d{4})$/);
        if (m) return m[1];
        const m2 = String(project.project_key).match(/_(\d{2})(\d{2})(\d{4})$/);
        if (m2) return m2[3];
      }
      if (project.created_at) {
        const d = new Date(project.created_at);
        if (!Number.isNaN(d.getTime())) return String(d.getFullYear());
      }
      return null;
    }

    function getLastGreenDescriptor(projectKey) {
      if (!projectKey || !Array.isArray(allRecallCheckpoints)) return 'Project launched';
      const projectCheckpoints = allRecallCheckpoints
        .filter((c) => c.project_key === projectKey)
        .sort((a, b) => (Number(a.checkpoint_index ?? 0) - Number(b.checkpoint_index ?? 0)));

      let lastGreenLabel = null;
      for (const cp of projectCheckpoints) {
        if (cp.locked && cp.roundel_green) {
          lastGreenLabel = cp.checkpoint_label;
        } else {
          break;
        }
      }

      return lastGreenLabel || 'Project launched';
    }

    function renderProjectsForYear(selectedYear) {
      if (!projectBody) return;
      projectBody.innerHTML = '';

      const filtered = allRecallProjects.filter((p) => {
        const y = extractYearFromProject(p);
        return y === String(selectedYear);
      });

      if (filtered.length === 0) {
        projectBody.innerHTML = `<div class="project-overview-empty">No active dry-docking projects for ${selectedYear}</div>`;
        return;
      }

      filtered.forEach((project) => {
        const vesselId = project.vessel_id || project.project_key || 'Unknown Vessel';
        const vesselName = project.vessel_name || 'Vessel';
        const criteria = project.docking_criteria ? ` - ${project.docking_criteria}` : '';
        const stageLabel = getLastGreenDescriptor(project.project_key);

        const isComplete = stageLabel.toLowerCase() === 'project completed';
        const stateClass = isComplete || stageLabel !== 'Project launched' ? 'active' : 'pending';

        const item = document.createElement('article');
        item.className = 'project-item';
        item.tabIndex = 0;
        item.setAttribute('role', 'button');
        item.setAttribute('aria-label', `Open project for ${vesselId}`);

        item.innerHTML = `
          <div>
            <strong>${vesselId}</strong>
            <small>${vesselName}${criteria}</small>
          </div>
          <span class="project-state ${stateClass}" title="${stageLabel}">${stageLabel}</span>
        `;

        item.addEventListener('click', () => openProjectFrontpage(project));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openProjectFrontpage(project);
          }
        });

        projectBody.appendChild(item);
      });
    }

    function openProjectFrontpage(project) {
      const context = {
        projectKey: project.project_key || '',
        createdAt: project.launch_date || project.created_at || new Date().toISOString(),
        vessel: {
          vesselId: project.vessel_id || '',
          vesselName: project.vessel_name || '',
          imo: project.imo || ''
        },
        docking: {
          dockingCriteria: project.docking_criteria || '',
          capSurveyRequired: project.cap_survey || '',
          estReleaseDate: project.est_release_date || ''
        },
        preferredLocations: [
          { location: project.loceta_1_label || '', date: project.loceta_1_date || '' },
          { location: project.loceta_2_label || '', date: project.loceta_2_date || '' },
          { location: project.loceta_3_label || '', date: project.loceta_3_date || '' }
        ]
      };

      try {
        localStorage.setItem(DDP_RUNNING_PROJECT_CONTEXT_KEY, JSON.stringify(context));
        sessionStorage.setItem(DDP_RUNNING_PROJECT_CONTEXT_KEY, JSON.stringify(context));
      } catch (err) {
        console.warn('Could not cache running project context:', err);
      }

      window.location.href = './dd-project-frontpage.html?from=review';
    }

    async function loadRecallDatabase() {
      const session = getSession?.() || {};
      const companyId = session.companyId || '11111111-1111-1111-1111-111111111111';

      try {
        const [parentRes, childRes] = await Promise.all([
          fetch(`http://localhost:3001/project-frontpage-recall?company_id=${companyId}`),
          fetch(`http://localhost:3001/project-frontpage-checkpoint-recall?company_id=${companyId}`)
        ]);

        if (parentRes.ok) {
          const parentData = await parentRes.json();
          allRecallProjects = Array.isArray(parentData.rows) ? parentData.rows : [];
        }

        if (childRes.ok) {
          const childData = await childRes.json();
          allRecallCheckpoints = Array.isArray(childData.rows) ? childData.rows : [];
        }
      } catch (err) {
        console.warn('Unable to reach local recall database:', err);
      }

      const currentYear = String(new Date().getFullYear());
      if (yearSelect) {
        yearSelect.value = currentYear;
      }
      renderProjectsForYear(yearSelect ? yearSelect.value : currentYear);
    }

    yearSelect?.addEventListener('change', () => {
      renderProjectsForYear(yearSelect.value);
    });

    startDockPilotPageGuard({
      supabase,
      landingPage: './DockPilot_landing.html'
    }).then(() => {
      loadRecallDatabase();
    }).catch((error) => {
      console.error('DockPilot guard startup failed:', error);
      window.location.href = './DockPilot_landing.html';
    });
  </script>
</body>
</html>
